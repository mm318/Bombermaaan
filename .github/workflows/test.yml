name: Test Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 16 * * *' # run at 4 PM UTC

jobs:
  build-all-targets:
    strategy:
      matrix:
        include:
          - target: 'native'
            optimization: 'debug'
          - target: 'native'
            optimization: 'safe'
          - target: 'emscripten'
            optimization: 'debug'
          - target: 'emscripten'
            optimization: 'fast'

    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libxext-dev libgles-dev libglx-dev libpulse-dev

      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install Emscripten SDK
        if: matrix.target == 'emscripten'
        run: zig build install-emsdk

      - name: Build game
        run: |
          zig build -Doptimize=${{ matrix.optimization }} \
            ${{ matrix.target == 'emscripten' && '-Dtarget=wasm32-emscripten' || '' }}
